services:
  vinted-horology-hunter:
    build:
      context: .
      dockerfile: Dockerfile
    image: vinted-horology-hunter:latest
    container_name: vinted-horology-hunter
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      # Persists SQLite database (cached watch appraisals, API keys, Radar schedule & logs)
      - ./data:/app/data
    environment:
      - TZ=Europe/Rome
      - HOROLOGY_DB_PATH=/app/data/horology_hunter.db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - WHATSAPP_PHONE=${WHATSAPP_PHONE:-}
      - WHATSAPP_APIKEY=${WHATSAPP_APIKEY:-}
